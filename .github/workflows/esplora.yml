name: Esplora fonti (temporaneo)
on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/esplora.yml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine
        run: |
          mkdir -p es
          i=0
          for u in \
            https://www.superenalotto.com/risultati-estrazione/17-11-2026 \
            https://www.superenalotto.com/risultati-estrazione/11-09-2026 \
            https://www.superenalotto.com/risultati-estrazione/16-02-2023 \
            https://www.superenalotto.com/risultati-estrazione/03-01-1998 \
            https://www.superenalotto.com/risultati-estrazione/22-05-2025 \
            https://www.superenalotto.com/vincite/quote-vincitori ; do
            i=$((i+1)); f=es/p$(printf %02d $i).html
            code=$(curl -sS -L -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o $f -w "%{http_code}" "$u" || echo ERR)
            echo "$f $code $(wc -c < $f 2>/dev/null) $u" | tee -a es/indice.txt
          done
      - name: Pubblica
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan es-tmp; git rm -rf --cached . -q; git add -f es
          git commit -q -m esplora; git push -f -q origin es-tmp:esplora
