name: Esplora fonti (temporaneo)
on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/esplora.yml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine
        run: |
          mkdir -p es
          i=0
          for u in \
            https://www.superenalotto.com/archivio/estrazioni-2025 \
            https://www.superenalotto.com/archivio/estrazioni-2010 \
            https://www.superenalotto.com/ \
            https://www.superenalotto.com/jackpot \
            https://www.superenalotto.com/vincite \
            https://www.superenalotto.com/statistiche \
            https://www.superenalotto.com/jackpot-vinti \
            https://www.superenalotto.com/vincite-superenalotto \
            https://www.superenalotto.com/risultati \
            https://www.superenalotto.com/estrazione \
            https://www.sisal.it/superenalotto/archivio-estrazioni \
            https://www.sisal.it/superenalotto/jackpot \
            https://it.wikipedia.org/wiki/SuperEnalotto ; do
            i=$((i+1)); f=es/p$(printf %02d $i).html
            code=$(curl -sS -L -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o $f -w "%{http_code}" "$u" || echo ERR)
            echo "$f $code $(wc -c < $f 2>/dev/null) $u" | tee -a es/indice.txt
          done
      - name: Pubblica
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan es-tmp; git rm -rf --cached . -q; git add -f es
          git commit -q -m esplora; git push -f -q origin es-tmp:esplora
