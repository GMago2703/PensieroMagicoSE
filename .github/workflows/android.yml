name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "mobile/**"
      - "pmse/core/**"
      - "pmse/__init__.py"
      - "strumenti/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q -o Acquire::Retries=5 \
              xvfb libgl1-mesa-dri libgl1 libmtdev1 libegl1 && break
            echo "Mirror non raggiungibile, riprovo con archive.ubuntu.com ($i)"
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 20
          done
          pip install "kivy[base]==2.3.1" numpy certifi pytest openpyxl
      - name: Test della logica dell'app
        run: python -m pytest -q tests/test_mobile.py tests/test_nucleo.py tests/test_ej.py
      - name: Prova grafica (app vera su schermo virtuale)
        env:
          FOTO_DIR: foto_android
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python mobile/prova_grafica.py
          PMSE_TELEFONO=1 FOTO_DIR=foto_android/telefono xvfb-run -a -s "-screen 0 1400x2400x24" python mobile/prova_grafica.py
      - name: Laboratorio sugli archivi veri (scaricati da Internet)
        continue-on-error: true
        timeout-minutes: 25
        run: python strumenti/laboratorio_reale.py
      - name: Pubblica le schermate sul ramo "foto-android"
        if: always()
        run: |
          ls foto_android || exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan foto-tmp
          git rm -rf --cached . -q
          git add -f foto_android
          git commit -q -m "Schermate app Android ${{ github.run_number }}"
          git push -f -q origin foto-tmp:foto-android

  apk:
    needs: prova
    runs-on: ubuntu-22.04
    outputs:
      firmata: ${{ steps.firma.outputs.firmata }}
    env:
      FIRMA_PW: ${{ secrets.APK_FIRMA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Strumenti di compilazione
        run: |
          sudo apt-get update -q || true
          sudo apt-get install -y -q -o Acquire::Retries=5 build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld
          pip install --upgrade pip
          pip install buildozer "cython<3.1" setuptools
      - name: Prepara i sorgenti (nucleo condiviso con la versione Windows)
        run: |
          mkdir -p mobile/pmse
          cp pmse/__init__.py pmse/icona.png mobile/pmse/
          cp -r pmse/core mobile/pmse/core
          cp -r pmse/dati mobile/pmse/dati
          find mobile -name __pycache__ -prune -exec rm -rf {} +
          # numero di versione interno sempre crescente: Android accetta l'aggiornamento solo così
          sed -i "s/^android.minapi = .*/&\nandroid.numeric_version = $((1000 + ${{ github.run_number }}))/" mobile/buildozer.spec
          grep numeric_version mobile/buildozer.spec
      - name: Chiave di firma fissa (cifrata nel repository con il segreto APK_FIRMA_PASSWORD)
        id: firma
        run: |
          if [ -z "$FIRMA_PW" ]; then
            echo "Segreto APK_FIRMA_PASSWORD assente: APK di prova con firma temporanea (non aggiornabile)."
            echo "firmata=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CH=mobile/firma/pensieromagico.keystore.enc
          if [ -f "$CH" ]; then
            # password sbagliata = errore: mai creare una chiave nuova, romperebbe gli aggiornamenti
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$CH" -out "$RUNNER_TEMP/pm.keystore" -pass env:FIRMA_PW
            keytool -list -keystore "$RUNNER_TEMP/pm.keystore" -storepass "$FIRMA_PW" -alias pensieromagico > /dev/null
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/pm.keystore" -alias pensieromagico -keyalg RSA \
              -keysize 4096 -validity 36500 -storepass "$FIRMA_PW" -keypass "$FIRMA_PW" \
              -dname "CN=Pensiero Magico, O=GMago2703, C=IT"
            mkdir -p mobile/firma
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/pm.keystore" -out "$CH" -pass env:FIRMA_PW
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git stash -q || true
            git add "$CH"
            git commit -q -m "Chiave di firma dell'APK (cifrata) [skip ci]"
            git pull -q --rebase origin main && git push -q origin HEAD:main
            git stash pop -q || true
          fi
          echo "firmata=si" >> "$GITHUB_OUTPUT"
      - name: Recupera la cache di buildozer
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ github.run_id }}
          restore-keys: buildozer-
      - name: Compila l'APK
        working-directory: mobile
        run: |
          set +e
          if [ "${{ steps.firma.outputs.firmata }}" = "si" ]; then
            export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/pm.keystore" P4A_RELEASE_KEYALIAS=pensieromagico
            export P4A_RELEASE_KEYSTORE_PASSWD="$FIRMA_PW" P4A_RELEASE_KEYALIAS_PASSWD="$FIRMA_PW"
            yes | buildozer -v android release > buildozer.log 2>&1
          else
            yes | buildozer -v android debug > buildozer.log 2>&1
          fi
          esito=$?
          tail -n 300 buildozer.log
          exit $esito
      - name: Salva la cache di buildozer (anche se la compilazione fallisce)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ github.run_id }}
      - name: Rinomina l'APK
        run: |
          ls -la mobile/bin
          cp "$(ls -t mobile/bin/*.apk | head -1)" PensieroMagico.apk
          if [ "${{ steps.firma.outputs.firmata }}" = "si" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* ~/.buildozer/android/platform/android-sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
            "$BT/apksigner" verify --print-certs PensieroMagico.apk | head -5
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PensieroMagico-apk
          path: PensieroMagico.apk

  emulatore:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PensieroMagico-apk
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnosi rete (i siti delle estrazioni rispondono a GitHub?)
        continue-on-error: true
        run: |
          for u in https://www.superenalotto.com/archivio/estrazioni-2026 https://www.euro-jackpot.net/it/risultati-archivio-2012; do
            curl -sS -m 40 -o /dev/null -A "Mozilla/5.0" -w "$u -> %{http_code} in %{time_total}s\n" "$u" || echo "$u -> non raggiungibile"
          done
      - name: Scarica l'APK firmato precedente (per provare l'aggiornamento senza perdere i dati)
        if: needs.apk.outputs.firmata == 'si'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases?per_page=40" --jq '[.[] | select(.name | contains("firmata"))][0].tag_name // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" -R "${{ github.repository }}" -p PensieroMagico.apk -O Precedente.apk && echo "Precedente: $tag"
          else
            echo "Nessuna release firmata precedente: è la prima."
          fi
      - name: Prova l'APK su un emulatore Android (archivi veri da Internet)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/prova_emulatore.sh
      - name: Pubblica schermate e log dell'emulatore sul ramo "foto-emulatore"
        if: always()
        run: |
          ls emu || exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan emu-tmp
          git rm -rf --cached . -q
          git add -f emu/*
          git commit -q -m "Prova su emulatore ${{ github.run_number }}"
          git push -f -q origin emu-tmp:foto-emulatore
      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pensiero Magico per Android (build ${{ github.run_number }})${{ needs.apk.outputs.firmata == 'si' && ' – firmata' || '' }}
          body: |
            App Android (versione ridotta): archivio con aggiornamento da Internet, Magico Pensiero,
            verifica storica, intelligenza artificiale, laboratorio e concorsi con il 6, per SuperEnalotto ed
            Eurojackpot (separati).
            ${{ needs.apk.outputs.firmata == 'si' && 'Firma fissa: si installa sopra la versione precedente e archivio, allenamenti e impostazioni restano.' || 'ATTENZIONE: firma temporanea, per installarla va prima disinstallata la versione precedente.' }}
            Scarica PensieroMagico.apk dal telefono e installalo (consenti l'installazione da fonti sconosciute).
            Commit ${{ github.sha }}.
          files: PensieroMagico.apk
          make_latest: false
