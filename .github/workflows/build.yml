name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test (nucleo + interfaccia senza schermo)
        env:
          QT_QPA_PLATFORM: windows
          FOTO_DIR: foto
        run: python -m pytest -v

      - name: Carica le immagini delle finestre
        uses: actions/upload-artifact@v4
        with:
          name: foto-finestre
          path: foto/

      - name: Crea l'eseguibile
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PensieroMagicoSE
          --icon pmse/icona.ico
          --add-data "pmse/icona.png;pmse"
          PensieroMagicoSE.py

      - name: Carica l'eseguibile tra gli artifact
        uses: actions/upload-artifact@v4
        with:
          name: PensieroMagicoSE-exe
          path: dist/PensieroMagicoSE.exe

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pensiero Magico SE (build ${{ github.run_number }})
          body: Versione generata automaticamente dal commit ${{ github.sha }}. Scarica PensieroMagicoSE.exe qui sotto.
          files: dist/PensieroMagicoSE.exe
          make_latest: true

      - name: Pubblica le immagini delle finestre sul ramo "foto"
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan foto-tmp
          git rm -rf --cached . -q
          git add -f foto/*.png
          git commit -q -m "Immagini finestre build ${{ github.run_number }}"
          git push -f -q origin foto-tmp:foto
