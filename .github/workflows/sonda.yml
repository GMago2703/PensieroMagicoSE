name: Sonda pagine (solo manuale)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le pagine
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) PensieroMagico"
          curl -sL -A "$UA" https://www.euro-jackpot.net/it -o ej_home.html || true
          curl -sL -A "$UA" https://www.euro-jackpot.net/it/risultati-archivio-2026 -o ej_arch.html || true
          link=$(grep -o 'href="/it/risultati/[^"]*"' ej_arch.html | head -1 | cut -d'"' -f2)
          echo "link $link"
          [ -n "$link" ] && curl -sL -A "$UA" "https://www.euro-jackpot.net$link" -o ej_risultato.html || true
          curl -sL -A "$UA" https://www.superenalotto.com/ -o se_home.html || true
          ls -la
      - name: Pubblica
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan sonde-tmp; git rm -rf --cached . -q
          rm -rf sonde && mkdir sonde && cp /tmp/s/*.html sonde/
          git add -f sonde; git commit -q -m sonde; git push -f -q origin sonde-tmp:sonde
